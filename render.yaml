# Konfigurasi untuk deploy ke Render

services:
  - type: web
    name: ai-chatbot
    runtime: docker
    plan: free # Ubah ke paid jika perlu
    region: singapore # Atau region lain yang diinginkan
    
    # Environment variables
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      # Tambahkan database credentials dari Render dashboard
      # - key: DB_HOST
      #   fromDatabase:
      #     name: your-db
      #     property: host
      # - key: DB_USER
      #   fromDatabase:
      #     name: your-db
      #     property: user
      # - key: DB_PASSWORD
      #   fromDatabase:
      #     name: your-db
      #     property: password
      # - key: DB_NAME
      #   fromDatabase:
      #     name: your-db
      #     property: name
      # Generate APP_KEY dengan: php artisan key:generate --show
      - key: APP_KEY
        sync: false # Set this dan generate sendiri via Render dashboard

  # Database (optional - uncomment jika ingin setup PostgreSQL)
  # - type: pgsql
  #   name: ai-chatbot-db
  #   plan: free
  #   region: singapore
  #   ipAllowList: []
